# 本地开发配置（SQLite 文件数据库，无需外部数据库服务）
spring:
  datasource:
    url: jdbc:sqlite:${user.home}/.syncbridge/sync_platform.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-sqlite.sql

mybatis-plus:
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.sync: DEBUG
    root: INFO
